name: my-ecm

include:
  - ./apps/identity-service/compose.yml
  - ./apps/product-service/compose.yml
  - ./apps/notification-service/compose.yml
  - ./apps/order-service/compose.yml
  - ./apps/inventory-service/compose.yml
  - ./apps/payment-service/compose.yml
  - ./apps/shipping-service/compose.yml

services:
  db:
    extends:
      file: .docker/compose.base.yml
      service: db
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.docker/volumes/pg_data:/var/lib/postgresql/data
