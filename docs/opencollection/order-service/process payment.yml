info:
  name: process payment
  type: http
  seq: 3

http:
  method: POST
  url: "{{order}}/checkouts/{{checkout_id}}/process-payment"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body?.payment?.id) bru.setEnvVar('payment_id', body.payment.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
