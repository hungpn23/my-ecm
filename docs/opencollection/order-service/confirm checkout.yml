info:
  name: confirm checkout
  type: http
  seq: 4

http:
  method: POST
  url: "{{order}}/checkouts/{{checkout_id}}/confirm"
  body:
    type: json
    data: |-
      {
        "paymentId": "{{payment_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
