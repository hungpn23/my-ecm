opencollection: 1.0.0

info:
  name: my-ecm
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        const accessToken = bru.getEnvVar('access_token')
        const publicRequests = ['sign-up', 'token', 'refresh', 'revoke']

        if (!publicRequests.includes(req.getName()) && accessToken) {
          req.setHeader('Authorization', 'Bearer ' + accessToken)
        }
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body?.accessToken) bru.setEnvVar('access_token', body.accessToken)
        if (body?.refreshToken) bru.setEnvVar('refresh_token', body.refreshToken)
        if (typeof body?.expiresIn === 'number') bru.setEnvVar('expires_in', body.expiresIn)
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
      defaultEnvironment: env
