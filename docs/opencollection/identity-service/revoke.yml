info:
  name: revoke
  type: http
  seq: 3

http:
  method: POST
  url: "{{identity}}/auth/token/revoke"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refresh_token}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar('access_token', '')
          bru.setEnvVar('refresh_token', '')
          bru.setEnvVar('expires_in', 0)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
