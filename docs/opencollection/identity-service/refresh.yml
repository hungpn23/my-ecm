info:
  name: refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{identity}}/auth/token/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refresh_token}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
