info:
  name: refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{identity}}/auth/refresh"
  headers:
    - name: Authorization
      value: Bearer  {{refresh_token}}
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
