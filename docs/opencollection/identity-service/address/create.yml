info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{identity}}/addresses"
  body:
    type: json
    data: |-
      {
        "recipientName": "Phạm Ngọc Hùng",
        "phone": "0961058815",
        "address": "4/163 Phố Phú Đô, TP. Hà Nội"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('address_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
