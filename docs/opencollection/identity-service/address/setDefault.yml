info:
  name: setDefault
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{identity}}/addresses/{{address_id}}/default"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('address_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
