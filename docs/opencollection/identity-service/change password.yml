info:
  name: change password
  type: http
  seq: 5

http:
  method: POST
  url: "{{identity}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "12341234",
        "newPassword": "12345678"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
