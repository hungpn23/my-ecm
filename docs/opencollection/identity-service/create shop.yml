info:
  name: create shop
  type: http
  seq: 11

http:
  method: POST
  url: "{{identity}}/shops"
  body:
    type: json
    data: |-
      {
        "name": "{{$randomCity}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('shop_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
