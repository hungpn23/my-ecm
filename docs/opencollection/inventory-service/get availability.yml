info:
  name: get availability
  type: http
  seq: 2

http:
  method: GET
  url: "{{inventory}}/availability?productId={{product_id}}"
  params:
    - name: productId
      value: "{{product_id}}"
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
