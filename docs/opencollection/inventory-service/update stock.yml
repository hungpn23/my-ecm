info:
  name: update stock
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{inventory}}/stocks/{{product_id}}"
  body:
    type: json
    data: |-
      {
        "onHand": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
