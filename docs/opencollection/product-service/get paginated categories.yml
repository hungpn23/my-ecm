info:
  name: get paginated categories
  type: http
  seq: 2

http:
  method: GET
  url: "{{product}}/categories?page=2&pageSize=10&search="
  params:
    - name: page
      value: "2"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: search
      value: ""
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.data?.[0]?.id) bru.setEnvVar('category_id', body.data[0].id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
