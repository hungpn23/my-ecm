info:
  name: browse catalog products
  type: http
  seq: 10

http:
  method: GET
  url: "{{product}}/catalog/products?page=1&pageSize=10&sort=newest&minPrice=1.00&maxPrice=1000.99"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: sort
      value: newest
      type: query
    - name: search
      value: generic
      type: query
      disabled: true
    - name: categoryId
      value: 01a129a1-536c-701b-815c-f53ecd1760ae
      type: query
      disabled: true
    - name: minPrice
      value: "1.00"
      type: query
    - name: maxPrice
      value: "1000.99"
      type: query

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.data?.[0]?.id) bru.setEnvVar('product_id', body.data[0].id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
