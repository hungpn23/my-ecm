info:
  name: get product
  type: http
  seq: 7

http:
  method: GET
  url: "{{product}}/products/{{product_id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('product_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
