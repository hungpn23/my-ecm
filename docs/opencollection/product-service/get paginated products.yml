info:
  name: get paginated products
  type: http
  seq: 6

http:
  method: GET
  url: "{{product}}/products?page=1&pageSize=10&search=BAN"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
    - name: search
      value: BAN
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.data?.[0]?.id) bru.setEnvVar('product_id', body.data[0].id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
