info:
  name: create product
  type: http
  seq: 5

http:
  method: POST
  url: "{{product}}/products"
  body:
    type: json
    data: |-
      {
        "name": "BAN AN GO",
        "description": "Ban an 4 cho ngoi",
        "price": "1250000.00",
        "status": "active",
        "categoryId": "{{category_id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('product_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
