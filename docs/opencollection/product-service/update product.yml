info:
  name: update product
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{product}}/products/{{product_id}}"
  body:
    type: json
    data: |-
      {
        "name": "BAN AN GO CAO CAP FRWEEEEEEE",
        "price": "0.00",
        "status": "active",
        "categoryId": "{{category_id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        if (body.id) bru.setEnvVar('product_id', body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
