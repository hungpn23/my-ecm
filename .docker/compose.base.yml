services:
  jwt-private-key:
    volumes:
      - type: bind
        source: ../.tmp/identity-ed25519-private.pem
        target: /run/keys/identity-ed25519-private.pem
        read_only: true
        bind:
          create_host_path: false

  jwt-public-key:
    volumes:
      - type: bind
        source: ../.tmp/identity-ed25519-public.pem
        target: /run/keys/identity-ed25519-public.pem
        read_only: true
        bind:
          create_host_path: false

  node:
    container_name: node
    tty: true
    working_dir: /app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: apisix
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    restart: unless-stopped

  kafka-connect:
    build:
      context: ..
      dockerfile: .docker/kafka-connect.Dockerfile
    image: kafka-connect-debezium:1.0.0
    container_name: kafka-connect
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:1764f6a
    container_name: kafbat-ui
    depends_on:
      - kafka
    restart: unless-stopped
