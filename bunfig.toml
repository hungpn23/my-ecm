[run]
bun = true

[fmt]
sortImports = true
sortPackageJson = true
jsdoc = true
editorconfig = false
printWidth = 120
ignorePatterns = ["tools/oxlint/anti-slop/**", "**/entities.generated.ts", "**/migration/*"]

[lint]
typeAware = true
typeCheck = true
ignorePatterns = ["tools/oxlint/anti-slop/**", "**/entities.generated.ts", "**/migration/*", "scripts/**"]
plugins = ["./tools/oxlint/anti-slop/index.ts"]

[lint.rules]
"anti-slop/no-chained-type-assertions" = "error"
"anti-slop/no-conditional-empty-object-spread" = "error"
"anti-slop/no-known-value-widening" = "error"
"anti-slop/no-module-mocking" = "error"
"anti-slop/no-object-parameters" = "error"
"anti-slop/no-reflect-apply" = "error"
"anti-slop/no-reflect-get" = "error"
"anti-slop/no-runtime-typeof" = "error"
"anti-slop/no-shape-in-symbol-names" = "error"
"anti-slop/no-unknown-parameters" = "off"
"anti-slop/no-unknown-returns" = "error"
"anti-slop/no-unknown-type-aliases" = "error"
"anti-slop/no-unsafe-dictionary-type" = "error"
"anti-slop/no-widen-then-assert" = "error"
"anti-slop/require-safety-comment-for-type-assertion" = "error"
"accessor-pairs" = "error"
"array-callback-return" = "error"
"arrow-body-style" = "error"
"camelcase" = "error"
"complexity" = ["error", { variant = "modified" }]
curly = ["error", "multi-line", "consistent"]
"default-case" = "error"
"default-case-last" = "error"
"eqeqeq" = "error"
"func-name-matching" = "error"
"func-names" = "error"
"guard-for-in" = "error"
"logical-assignment-operators" = "error"
"max-classes-per-file" = "error"
"max-depth" = "error"
"max-lines-per-function" = ["error", { skipBlankLines = true, skipComments = true }]
"max-nested-callbacks" = ["error", 2]
"max-statements" = ["error", 10, { ignoreTopLevelFunctions = true }]
"no-await-in-loop" = "error"
"no-continue" = "error"
"no-duplicate-imports" = ["error", { includeExports = true }]
"no-else-return" = "error"
"no-implicit-coercion" = "error"
"no-inner-declarations" = "error"
"no-lonely-if" = "error"
"no-multi-assign" = "error"
"no-multi-str" = "error"
"no-negated-condition" = "error"
"no-nested-ternary" = "error"
"no-param-reassign" = "error"
"no-plusplus" = "error"
"no-return-assign" = "error"
"no-self-compare" = "error"
"no-self-assign" = "error"
"no-unassigned-vars" = "error"
"no-unreachable" = "error"
"no-unused-labels" = "error"
"no-useless-catch" = "error"
"no-var" = "error"
"prefer-const" = "error"
"@typescript-eslint/prefer-destructuring" = [
  "error",
  { object = true, array = true },
  { enforceForRenamedProperties = true, enforceForDeclarationWithTypeAnnotation = true },
]
"prefer-rest-params" = "error"
"preserve-caught-error" = "error"
"unicorn/no-array-for-each" = "error"
"unicorn/no-array-reduce" = "error"
"unicorn/prefer-ternary" = ["error", "only-single-line"]
"@typescript-eslint/consistent-return" = "error"
"@typescript-eslint/default-param-last" = "error"
"@typescript-eslint/dot-notation" = "error"
"@typescript-eslint/no-shadow" = "error"
"@typescript-eslint/no-this-alias" = "error"
"@typescript-eslint/no-unused-vars" = "error"
"@typescript-eslint/adjacent-overload-signatures" = "error"
"@typescript-eslint/array-type" = "error"
"@typescript-eslint/ban-ts-comment" = "error"
"@typescript-eslint/consistent-generic-constructors" = "error"
"@typescript-eslint/consistent-indexed-object-style" = "error"
"@typescript-eslint/consistent-type-assertions" = "error"
"@typescript-eslint/consistent-type-definitions" = "error"
"@typescript-eslint/explicit-function-return-type" = "error"
"@typescript-eslint/explicit-member-accessibility" = ["error", { accessibility = "no-public" }]
"@typescript-eslint/explicit-module-boundary-types" = "error"
"@typescript-eslint/init-declarations" = "error"
"@typescript-eslint/member-ordering" = "error"
"@typescript-eslint/method-signature-style" = "error"
"@typescript-eslint/no-array-delete" = "error"
"@typescript-eslint/no-base-to-string" = "error"
"@typescript-eslint/no-deprecated" = "error"
"@typescript-eslint/no-dupe-class-members" = "error"
