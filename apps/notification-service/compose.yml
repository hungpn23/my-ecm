services:
  notification-service:
    container_name: ${APP_NAME}
    build:
      context: ../..
      args:
        APP_FOLDER_NAME: notification-service
    image: my-ecm/${APP_NAME}:production
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - ../../.env
      - ./.env
      - ../../.env.docker
    restart: unless-stopped
